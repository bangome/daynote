<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — Daynote</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/site.css">
<style>
.nf { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; }
.nf__body { display: grid; align-content: center; gap: 16px; padding-block: 64px; }
.nf__code { font-family: var(--font-display); font-weight: 300; font-size: clamp(64px, 12vw, 160px); line-height: 1; color: var(--sun-deep); letter-spacing: -0.04em; }
.nf__body p { color: var(--ink-2); font-size: 18px; max-width: 40ch; }
</style>
</head>
<body class="nf">
<header class="top"><div class="wrap top__row"><a class="brand" href="/" aria-label="Daynote"><img src="/img/logo-en.webp" width="150" height="42" alt="Daynote"></a></div></header>
<main class="wrap nf__body">
  <div class="nf__code" aria-hidden="true">404</div>
  <h1 class="h2">이 날짜에는 아무것도 없네요.</h1>
  <p>요청한 페이지가 없습니다. 주소가 바뀌었거나 잘못 입력된 것 같습니다.</p>
  <p><a class="link-arrow" href="/">처음으로 돌아가기</a> &nbsp;·&nbsp; <a class="link-arrow" href="/en/" lang="en">Back to the start</a></p>
</main>
<div class="horizon" aria-hidden="true"><span class="horizon__sun"></span></div>
</body>
</html>
