name = "daynote-cloud"
main = "src/index.ts"
compatibility_date = "2025-09-15"

# No *.workers.dev hostname and no preview URLs: the service accepts account registrations, so it
# should only be reachable on a domain that is deliberately attached. Flip workers_dev to true for a
# throwaway verification run, then flip it back.
workers_dev = false
preview_urls = false

# JWT_SECRET is a secret, not a var. Set it with:
#   wrangler secret put JWT_SECRET
# Generate one with:
#   node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"

# Password-reset email. MAILCHANNELS_API_KEY and DKIM_PRIVATE_KEY are secrets:
#   wrangler secret put MAILCHANNELS_API_KEY
#   wrangler secret put DKIM_PRIVATE_KEY
# DKIM is not optional in practice — without it the reset code goes to spam. Publish the public half
# as a TXT record at mailchannels._domainkey.daynote.arachat.cc, and an SPF record permitting
# MailChannels on daynote.arachat.cc.

[vars]
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_DAYS = "60"
EMAIL_FROM = "no-reply@daynote.arachat.cc"
EMAIL_FROM_NAME = "Daynote"
DKIM_DOMAIN = "daynote.arachat.cc"
DKIM_SELECTOR = "mailchannels"

[[d1_databases]]
binding = "DB"
database_name = "daynote"
database_id = "4226d475-a071-44c0-a2c7-4a953cbaa44e"
migrations_dir = "migrations"

# R2 arrives with Phase 7 (encrypted attachments); left commented so the binding is not silently
# created before the code that uses it exists.
# [[r2_buckets]]
# binding = "ASSETS"
# bucket_name = "daynote-assets"

[observability]
enabled = true
