name = "daynote-cloud"
main = "src/index.ts"
compatibility_date = "2025-09-15"

# No *.workers.dev hostname and no preview URLs: the service accepts account registrations, so it
# should only be reachable on a domain that is deliberately attached. Flip workers_dev to true for a
# throwaway verification run, then flip it back.
workers_dev = false
preview_urls = false

# JWT_SECRET is a secret, not a var. Set it with:
#   wrangler secret put JWT_SECRET
# Generate one with:
#   node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))"

# Google sign-in. The client id below is public; the matching secret is a Worker secret so it never
# ships inside the app:
#   wrangler secret put GOOGLE_CLIENT_SECRET
#
# Seals each account's data key at rest (src/dek.ts):
#   wrangler secret put DEK_WRAP_KEY
#
# Sign in with Apple, for the iPhone app (DEPLOY.md §2c). The .p8 key from the Apple Developer
# console signs the client secret Apple wants on every token call:
#   wrangler secret put APPLE_PRIVATE_KEY
#
# Subscriptions, over Paddle (docs/CLOUD_SYNC.md §14, DEPLOY.md §2b):
#   wrangler secret put PADDLE_WEBHOOK_SECRET   # Developer tools -> Notifications -> destination
#
# Subscriptions in the iPhone app, over In-App Purchase (docs/CLOUD_SYNC.md §14.8, DEPLOY.md §2d).
# The In-App Purchase key from App Store Connect signs the App Store Server API token:
#   wrangler secret put APPLE_IAP_PRIVATE_KEY < SubscriptionKey_F47T589ZC4.p8
#
#   wrangler secret put PADDLE_API_KEY          # Developer tools -> Authentication
#                                               # (creates the checkout and the portal link,
#                                               # and changes a subscription between tiers)

# docs/PRIVACY.md is bundled as text so /privacy serves the repository's own policy rather than a
# copy that has to be republished by hand. See src/privacy.ts.
[[rules]]
type = "Text"
globs = ["**/*.md"]
# Without this the rule replaces wrangler's defaults instead of adding to them, silently turning off
# text imports for .txt/.html/.sql.
fallthrough = true

# The brand site (../site) rides on this Worker because daynote.arachat.cc is a Custom Domain of it,
# and a Custom Domain cannot be shared with a second Worker on the same hostname. Everything not
# listed in run_worker_first is answered by the static assets; the API and /privacy stay in code.
# Build the pages first: `npm run build:site` (also runs as predeploy).
[assets]
directory = "../site/public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/v1/*", "/privacy", "/delete-account"]

[vars]
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_DAYS = "60"
GOOGLE_CLIENT_ID = "298036592294-mp11166n940ojbq4js3u5233ruvkk2ic.apps.googleusercontent.com"

# The phone clients, from the same Google project. Empty until they exist, and while one is empty
# that platform's sign-in is refused with a message rather than failing somewhere inside Google.
# Neither has a secret to set: Google issues none for the iOS or Android client type, and PKCE is
# what binds the code to the attempt. See docs/MOBILE_PORT.md.
GOOGLE_IOS_CLIENT_ID = "298036592294-21i9l31vhlihpfi6898b8inc0045nnhh.apps.googleusercontent.com"
GOOGLE_ANDROID_CLIENT_ID = "298036592294-n5uff4qakgibac545udo1jthfqonvku2.apps.googleusercontent.com"

# Sign in with Apple (src/apple.ts, DEPLOY.md §2c). The bundle id is the app's and doubles as the
# OAuth client id; the team id and the id of the Sign in with Apple key come from the Apple
# Developer console. Public, so vars. While either id or the APPLE_PRIVATE_KEY secret is empty,
# POST /v1/auth/apple is refused with a message the app shows, as for an unconfigured Google client.
APPLE_BUNDLE_ID = "cc.arachat.daynote"
APPLE_TEAM_ID = "4T8C76SP99"
APPLE_KEY_ID = "W2B29H98NT"

# The four prices the subscription is sold at (Paddle -> Catalog -> "Daynote Cloud Sync"), two
# tiers at two intervals. Public, so vars. Both tiers sync images and files; they differ in storage.
#
#   Pro      2 GB                          monthly ₩2,900 / $2.49   annual ₩24,000 / $19.99
#   Premium  "unlimited" (200 GB fair use)  monthly ₩5,900 / $4.99   annual ₩48,000 / $39.99
#
# Pro keeps the unprefixed names it had before Premium existed. The same amounts are written out in
# src/billing.ts (PRICE_LIST), which is what the app displays; the site's pricing page and the Store
# listing state them too. Change a price in Paddle and all three follow it, or the app shows one
# number and the checkout charges another.
#
# The app POSTs {"tier": "pro" | "premium", "plan": "monthly" | "annual"}; apps installed before
# Premium send {"plan"} alone or no body, which buys Pro (annual when there is no body). A running
# subscription moves between tiers through /v1/billing/change, never a second checkout.
# Neither the checkout nor the portal has a URL to configure: both are created per click by
# /v1/billing/checkout and /v1/billing/portal. The checkout has to be, because only a
# server-created transaction can carry the custom_data that ties it to an account.
#
# The webhook reads the tier from the subscription's price. A price that is not listed here reads as
# Pro — the smaller quota — so the Premium ids must be set before a Premium price can be bought
# anywhere, including from the Paddle dashboard.
#
# ON SALE since 2026-09-30. The ids were empty from the first Store release (2026-09-10) until
# then: attachment sync had no R2 bucket behind it, and nothing was sold. The bucket exists now
# (daynote-assets), and both tiers went on sale together with migrations/0010_tiers.sql.
#
# Emptying a pair takes that tier off sale with no app update: `availablePlans()` stops listing it,
# and installed copies drop its purchase surfaces on their next status call. With all four empty,
# `/v1/billing/status` reports `can_checkout: false` and the app hides billing entirely
# (AccountViewModel.OffersSubscription), trial countdown included.
#
# Store policy 10.8.3 may still require a Company account for a Microsoft Store product that offers
# a paid tier; see docs/STORE.md.
# The App Store side of the same four offers (src/appStore.ts, APPLE_PRODUCTS maps each id to its
# tier and interval). Group "Daynote Cloud" in App Store Connect, Premium ranked above Pro. The App
# Store sets the price per storefront from the KRW base: ₩2,900 / ₩24,000 / ₩5,900 / ₩48,000.
# The ids listed here are the ones the iPhone app offers; emptying the list takes the App Store off
# sale in the app without a release, and changes nothing for anyone already subscribed.
# The key id and issuer id are public; the key is the APPLE_IAP_PRIVATE_KEY secret above. Until it
# is set, the app is offered nothing to buy and /v1/billing/apple/transaction is refused.
APPLE_IAP_KEY_ID = "F47T589ZC4"
APPLE_IAP_ISSUER_ID = "fff3ff8a-e95d-496f-8c6d-aab2b5bf2455"
APPLE_IAP_PRODUCTS = "cc.arachat.daynote.pro.monthly,cc.arachat.daynote.pro.annual,cc.arachat.daynote.premium.monthly,cc.arachat.daynote.premium.annual"
APPLE_APP_ID = "6817146422"

PADDLE_PRICE_ID_MONTHLY = "pri_01m1nb3xgjdycqb2fzjfxfed98"
PADDLE_PRICE_ID_ANNUAL = "pri_01m1nb2txkj2aner6c88g1m2f4"
PADDLE_PRICE_ID_PREMIUM_MONTHLY = "pri_01m3s234hqdvrfnf5ksf25jp7v"
PADDLE_PRICE_ID_PREMIUM_ANNUAL = "pri_01m3s24dn13q3r0ygsftksc132"

[[d1_databases]]
binding = "DB"
database_name = "daynote"
database_id = "4226d475-a071-44c0-a2c7-4a953cbaa44e"
migrations_dir = "migrations"

# Encrypted attachment bytes (docs/CLOUD_SYNC.md §5.4). Create it once before the first deploy
# that serves the asset routes:
#   wrangler r2 bucket create daynote-assets
#
# The binding is ASSET_BUCKET, not the ASSETS the design sketch named: [assets] above already holds
# that name for the brand site, and a Worker cannot bind one name twice.
[[r2_buckets]]
binding = "ASSET_BUCKET"
bucket_name = "daynote-assets"

[observability]
enabled = true
